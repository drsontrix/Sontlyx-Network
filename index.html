
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SontlyX Network | Yakında Sizlerleyiz</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #111318;
}

/* ARKA PLAN */
.background {
    position: fixed;
    inset: 0;
    background:
        linear-gradient(
            rgba(12, 14, 18, .55),
            rgba(12, 14, 18, .78)
        ),
        url("arkaplan.jpg") center center / cover no-repeat;
    transform: scale(1.04);
    animation: backgroundMove 18s ease-in-out infinite alternate;
    z-index: -2;
}

/* Arka plan ışık efekti */
.background::after {
    content: "";
    position: absolute;
    inset: 0;
    background: radial-gradient(
        circle at center,
        transparent 10%,
        rgba(0,0,0,.45) 100%
    );
}

/* ANA KUTU */
.sontlyx-coming {
    position: relative;
    width: min(90%, 680px);
    padding: 65px 30px;
    text-align: center;
    overflow: hidden;

    border: 1px solid rgba(255,255,255,.18);
    border-radius: 30px;

    background: rgba(25, 27, 32, .55);
    backdrop-filter: blur(22px);
    -webkit-backdrop-filter: blur(22px);

    box-shadow:
        0 25px 80px rgba(0,0,0,.4),
        inset 0 1px 1px rgba(255,255,255,.12);

    animation: boxAppear 1.2s cubic-bezier(.2,.8,.2,1),
               boxFloat 5s ease-in-out 1.2s infinite;
}

/* Kutu ışık geçişi */
.sontlyx-coming::before {
    content: "";
    position: absolute;
    top: -100%;
    left: -60%;
    width: 70%;
    height: 300%;
    transform: rotate(25deg);
    background: linear-gradient(
        90deg,
        transparent,
        rgba(255,255,255,.13),
        transparent
    );
    animation: shine 6s ease-in-out infinite;
    pointer-events: none;
}

/* ÜST ETİKET */
.sx-label {
    color: #c4c8d0;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 6px;
    margin-bottom: 27px;
    animation: fadeUp 1s .3s both;
}

/* ANA BAŞLIK */
.sx-title {
    color: #fff;
    font-size: clamp(25px, 5vw, 43px);
    font-weight: 850;
    letter-spacing: 1.5px;
    line-height: 1.25;
    text-shadow: 0 3px 25px rgba(0,0,0,.5);
    animation: fadeUp 1s .5s both;
}

/* NOKTALAR */
.sx-dots span {
    display: inline-block;
    animation: dotAnimation 1.5s infinite;
}

.sx-dots span:nth-child(2) {
    animation-delay: .2s;
}

.sx-dots span:nth-child(3) {
    animation-delay: .4s;
}

/* ALT AÇIKLAMA */
.sx-description {
    margin-top: 20px;
    color: #d0d2d8;
    font-size: 14px;
    letter-spacing: .4px;
    animation: fadeUp 1s .7s both;
}

/* DURUM ETİKETİ */
.sx-status {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 10px;

    margin-top: 32px;
    padding: 11px 19px;

    border: 1px solid rgba(120,220,210,.3);
    border-radius: 50px;

    background: rgba(114,217,206,.09);
    color: #d8f1ed;

    font-size: 10px;
    font-weight: 700;
    letter-spacing: 2px;

    animation: fadeUp 1s .9s both;
}

/* DURUM NOKTASI */
.sx-status i {
    display: block;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #72d9ce;
    box-shadow: 0 0 13px #72d9ce;
    animation: pulse 1.5s infinite;
}

/* ALT MARKA */
.sx-footer {
    position: absolute;
    bottom: 24px;
    left: 0;
    width: 100%;
    text-align: center;
    color: rgba(255,255,255,.55);
    font-size: 10px;
    letter-spacing: 3px;
}

/* ANİMASYONLAR */
@keyframes boxAppear {
    from {
        opacity: 0;
        transform: translateY(35px) scale(.94);
        filter: blur(12px);
    }
    to {
        opacity: 1;
        transform: translateY(0) scale(1);
        filter: blur(0);
    }
}

@keyframes boxFloat {
    0%, 100% {
        transform: translateY(0);
    }
    50% {
        transform: translateY(-7px);
    }
}

@keyframes shine {
    0% {
        left: -80%;
    }
    45%, 100% {
        left: 150%;
    }
}

@keyframes fadeUp {
    from {
        opacity: 0;
        transform: translateY(18px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@keyframes dotAnimation {
    0%, 60%, 100% {
        opacity: .25;
    }
    30% {
        opacity: 1;
    }
}

@keyframes pulse {
    0%, 100% {
        opacity: 1;
        transform: scale(1);
    }
    50% {
        opacity: .35;
        transform: scale(.75);
    }
}

@keyframes backgroundMove {
    from {
        transform: scale(1.04) translateX(-5px);
    }
    to {
        transform: scale(1.12) translateX(5px);
    }
}

/* MOBİL */
@media (max-width: 600px) {
    .sontlyx-coming {
        padding: 50px 20px;
        border-radius: 23px;
    }

    .sx-label {
        letter-spacing: 4px;
    }

    .sx-description {
        font-size: 13px;
    }
}

/* HAREKETİ AZALTMA AYARI */
@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
        animation: none !important;
        transition: none !important;
    }
}
</style>
</head>

<body>

<div class="background"></div>

<div class="sontlyx-coming">

    <div class="sx-label">
        SONTLYX NETWORK
    </div>

    <h1 class="sx-title">
        YAKINDA SİZLERLEYİZ<span class="sx-dots"><span>.</span><span>.</span><span>.</span></span>
    </h1>

    <p class="sx-description">
        Yeni deneyim çok yakında burada.
    </p>

    <div class="sx-status">
        <i></i>
        HAZIRLANIYOR
    </div>

</div>

<div class="sx-footer">
    SONTLYX NETWORK © 2026
</div>

</body>
</html>
